# ==================================================
# YAZI — minimal config
# Click / Enter: dir -> enter | text/code -> nvim | other -> system default
# Right-click or `O`: "Open With" menu
# ==================================================

[manager]
show_hidden = true

[opener]
edit = [
  { run = "nvim %s", desc = "Edit in nvim", for = "unix", block = true },
]
open = [
  { run = "xdg-open %s", desc = "Open", for = "linux" },
]

[open]
rules = [
  { mime = "text/*", use = ["edit"] },
  { mime = "{application/json,application/toml,application/xml,application/x-yaml,application/javascript,application/x-sh,application/x-shellscript,image/svg+xml,inode/empty}", use = ["edit"] },
  { url = "*", use = ["open"] },
]
