

# =============================================================================
#  TMUX CONFIG
#  Prefix: C-a   |   Reload: C-a r   |   Quick menu: C-a m
# =============================================================================
#  ... PANES        ... WINDOWS       ... SESSIONS
#  h/v  split        c   new          s     new
#  z    zoom         n/p prev-next     w     choose
#  x    kill         ,   rename        k     kill
#  Space resize      [ ] move L/R      Tab   last
#  >/<  swap         &   close         M-n   next
# =============================================================================

# Run fastfetch when a new tmux session starts
set-hook -g session-created 'run-shell "fastfetch"'

# -----------------------------------------------------------------------------
#  PREFIX — C-a instead of default C-b
# -----------------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ================================
#       CORE SETTINGS
# ================================
set -g mouse on
set -sg escape-time 0                         # no Esc delay in tmux/nvim
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"  # enable truecolor
set -g allow-passthrough on                   # let apps use passthrough (DCS)
set -g history-limit 50000                    # scrollback per pane
set -g display-time 4000                      # message/copy prompt duration
set -g status-interval 2                      # status bar refresh (sec)

# Stay attached when the last session/window is destroyed
set -g detach-on-destroy off

# Reload config
bind r source-file ~/.tmux.conf \; display "󰑓 Config Reloaded!"

# ================================
#        QUICK MENU (C-a m)
# ================================
# One key to rule them all: a floating menu of the most common actions.
# Each row also shows its keybinding, so C-a m doubles as a cheat-sheet.
bind m display-menu -T "#[align=centre,bold]#[fg=${fg_accent}] #S " \
    "New Window"        c "new-window -c \"#{pane_current_path}\"" \
    "New Window Prompt" C "command-prompt -p 'Window name:' 'new-window -n \"%%\" -c \"#{pane_current_path}\"'" \
    "Split Horizontal"  h "split-window -h -c \"#{pane_current_path}\"" \
    "Split Vertical"    v "split-window -v -c \"#{pane_current_path}\"" \
    "Break Pane"        ! "break-pane" \
    "Join Pane..."      @ "command-prompt -p 'Join pane from:' 'join-pane -s \"%%\"'" \
    "" \
    "Next Window"       n "next-window" \
    "Previous Window"   p "previous-window" \
    "Rename Window..."  , "command-prompt -p 'Rename window:' 'rename-window \"%%\"'" \
    "Move Window L/R"   [ "swap-window -t -1" \
    "Close Pane/Window" x "if-shell -F '#{==:#{window_panes},1}' 'confirm-before -p \"Kill window #W? (y/n)\" kill-window' 'kill-pane'" \
    "" \
    "New Session..."    s "command-prompt -p 'Session name:' 'new-session -s \"%%\"'" \
    "Choose Session"    S "choose-tree -Zs" \
    "Choose Window"     w "choose-window -Z" \
    "Previous Session"  Tab "switch-client -l" \
    "Kill Session..."   k "confirm-before -p 'Kill session #S? (y/n)' kill-session" \
    "" \
    "Resize Mode"       Space "switch-client -T resize" \
    "Copy Mode"         g "copy-mode" \
    "Paste Buffer"      P "paste-buffer" \
    "Tiled Layout"      = "select-layout tiled" \
    "" \
    "Reload Config"     r "source-file ~/.tmux.conf"

# ================================
#       SPLIT PANES (IMPROVED)
# ================================
# Open splits in the current pane's directory
bind h split-window -h -c "#{pane_current_path}"
bind v split-window -v -c "#{pane_current_path}"

# Quick pane switching with Alt+Arrow (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Traditional arrow keys with prefix
bind Up    select-pane -U
bind Down  select-pane -D
bind Left  select-pane -L
bind Right select-pane -R

# ================================
#        RESIZE MODE (ENHANCED)
# ================================
# Enter resize mode
bind Space switch-client -T resize

# Repeatable resize
bind -r -T resize Left  resize-pane -L 5
bind -r -T resize Right resize-pane -R 5
bind -r -T resize Up    resize-pane -U 5
bind -r -T resize Down  resize-pane -D 5

# Fine-grained resize (hold Shift)
bind -r -T resize S-Left  resize-pane -L 1
bind -r -T resize S-Right resize-pane -R 1
bind -r -T resize S-Up    resize-pane -U 1
bind -r -T resize S-Down  resize-pane -D 1

# Exit resize mode
bind -T resize Enter  switch-client -T root 
bind -T resize Escape switch-client -T root
bind -T resize q      switch-client -T root

# Quick resize without entering mode
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5
bind -r K resize-pane -U 5
bind -r J resize-pane -D 5

# ================================
#        PANE MANAGEMENT
# ================================
# Close current pane (no confirm). If it's the last pane, closing the window
# needs confirmation instead.
bind x if-shell -F '#{==:#{window_panes},1}' \
    "confirm-before -p 'Kill window #W? (y/n)' kill-window" \
    "kill-pane"

# Toggle pane zoom
bind z resize-pane -Z

# Swap panes
bind > swap-pane -D
bind < swap-pane -U

# Break pane into new window
bind ! break-pane

# Join pane from another window
bind @ command-prompt -p "Join pane from:" "join-pane -s '%%'"

# Equal pane layout
bind = select-layout tiled


# ================================
#        SESSIONS (ENHANCED)
# ================================
# New session
bind s command-prompt -p "New session name:" "new-session -s '%%'"

# Switch session interactively
bind w choose-session

# Kill session (with confirmation)
bind k confirm-before -p "Kill session #S? (y/n)" kill-session

# Quick session switching (without prefix)
bind -n M-p switch-client -p
bind -n M-n switch-client -n

# Switch to last session
bind Tab switch-client -l

# ================================
#        WINDOWS (ENHANCED)
# ================================
# New window in current directory
bind c new-window -c "#{pane_current_path}"
bind C command-prompt -p "Window name:" "new-window -n '%%' -c '#{pane_current_path}'"

# Navigate windows
bind n next-window
bind p previous-window
bind -n M-h previous-window
bind -n M-l next-window

# Window chooser
bind o choose-window

# Rename window
bind , command-prompt -p "Rename window:" "rename-window '%%'"

# Move window left/right
bind -r [ swap-window -t -1\; select-window -t -1
bind -r ] swap-window -t +1\; select-window -t +1

# Close window
# NOTE: closing handled by 'x' (see PANE MANAGEMENT) — '&' explicitly disabled
unbind &

# ================================
#     WINDOW NUMBERING
# ================================
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Jump to windows 1-9
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9
bind 0 select-window -t 10

# ================================
#     COPY MODE (ENHANCED)
# ================================
# NOTE: Escape no longer enters copy mode (too easy to hit accidentally).
# Enter copy mode with: C-a g  OR  mouse scroll up.
bind g copy-mode

# Vi-style copy mode
setw -g mode-keys vi

# Copy mode bindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel

# Paste
bind P paste-buffer


# ================================
#        STATUS BAR THEME
# ================================



# Color Palette
bg='default'
fg='#475266'
fg_bright='#565B66'
fg_current='#BFBDB6'
fg_accent='#ff5555'
fg_dim='#3a3f4a'
fg_success='#50fa7b'
fg_warning='#f1fa8c'

# Status bar settings
set-option -g status-position bottom
set-option -g status-justify absolute-centre
set-option -g status-style "bg=${bg},fg=${fg}"
set-option -g status-left-length 50
set-option -g status-right-length 120

# Left status: Session + Prefix indicator
set-option -g status-left "\
#[bg=${fg_accent},fg=default,bold]#{?client_prefix, PREFIX ,}#[bg=${bg},fg=${fg_accent}]#{?client_prefix,│,}\
#[bg=${bg},fg=${fg_current},bold] #S "

# Right status: Modes, Path, System, Date
set-option -g status-right "\
#[fg=${fg_accent},bold]#{?#{==:#{client_key_table},resize},󰊓 RESIZE │ ,}\
#[fg=${fg_warning},bold]#{?pane_in_mode, 󰆒 COPY │ ,}\
#[fg=${fg_success},bold]#{?window_zoomed_flag,󰊓 ZOOM │ ,}\
#[fg=${fg_bright},bold] #{b:pane_current_path} \
#[fg=${fg_dim},bold]. \
#[fg=${fg_current},bold]%a %b %d \
#[fg=${fg_dim},bold].\
#[fg=${fg_bright},bold]%H:%M:%S "


# Window status format
set -g window-status-separator "  "

# Inactive windows
set-option -g window-status-style "bg=${bg},fg=${fg}"
set-option -g window-status-format "\
#[fg=${fg_dim}]\
#[fg=${fg_dim}]\
#[fg=${fg}]#W\
#[fg=${fg_dim}]#{?window_flags,}"

# Active window
set-option -g window-status-current-style "bg=${bg},fg=${fg_current},bold"
set-option -g window-status-current-format "\
#[fg=${fg_accent},bold]\
#[fg=${fg_bright}]\
#[fg=${fg_current},bold]#W\
#[fg=${fg_success}]#{?window_zoomed_flag, 󰊓,}\
#[fg=${fg_accent}]#{?window_flags,#{window_flags},}"

# Activity & notifications
set-option -g window-status-bell-style "bg=${fg_accent},fg=${bg},bold"
set-option -g window-status-activity-style "bg=${bg},fg=${fg_accent},bold"
set-window-option -g monitor-activity on
set-option -g visual-activity off
set-option -g visual-bell off

# ================================
#     PANE BORDERS
# ================================
set -g pane-border-style "fg=#26262e"
set -g pane-active-border-style "fg=#565B66"
set-option -g pane-border-format "\
#{?pane_active,#[fg=${fg_accent}]#{?window_zoomed_flag,󰊓 }#[fg=${fg_bright}]#I:#{pane_current_command}, }"
set-option -g pane-border-status top

# ================================
#     VISUAL STYLING
# ================================
set-option -g set-titles on
set-option -g set-titles-string "#S › #W › #{pane_current_command}"
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_command}'

# Message & command styling
set-option -g message-style "bg=${fg_accent},fg=${bg},bold"
set-option -g message-command-style "bg=${fg_bright},fg=${bg},bold"

# Mode styling
set-option -g mode-style "bg=${fg_accent},fg=${bg},bold"

# Clock mode
set-window-option -g clock-mode-colour "${fg_accent}"
set-window-option -g clock-mode-style 24

# ================================
#        PLUGINS (TPM)
# ================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Plugin configuration
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'
set -g @yank_selection_mouse 'clipboard'
set -g @yank_selection_clipboard 'clipboard'
set -g @yank_selection 'primary'
set -g @shell 'zsh'
# Keep Ctrl+L as terminal clear-screen: use Ctrl+N to move pane right
set -g @vim_navigator_mapping_right 'C-n'

# TPM install
bind i run-shell "~/.tmux/plugins/tpm/bin/install_plugins"

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
